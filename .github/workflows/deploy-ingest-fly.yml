# Deploy @doneisbetter/ingest to Fly.io using fly.ingest.toml + Dockerfile.ingest.
#
# One-time: add repository secret FLY_API_TOKEN (https://fly.io/user/personal_access_tokens)
# Actions → Deploy ingest (Fly.io) → Run workflow
# Then locally: bash scripts/vercel-wire-ingest-upstream.sh https://impact-mm-ingest.fly.dev
#
name: Deploy ingest (Fly.io)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require FLY_API_TOKEN
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::error::Add repository secret FLY_API_TOKEN, or run locally: flyctl auth login && bash scripts/deploy-ingest-fly-and-wire-vercel.sh"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly app and volume
        run: |
          flyctl apps show impact-mm-ingest || flyctl apps create impact-mm-ingest
          flyctl volumes list -a impact-mm-ingest | grep -q ingest_data || \
            flyctl volumes create ingest_data --region iad --size 1 -a impact-mm-ingest --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy ingest image
        run: flyctl deploy --config fly.ingest.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke health
        run: curl -sfS https://impact-mm-ingest.fly.dev/health
